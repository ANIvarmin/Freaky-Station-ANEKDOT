- type: entity
  id: BorgChassisSecurity
  parent: BorgChassisSelectable
  name: security cyborg
  components:
  - type: BorgSwitchableType
    selectedBorgType: security
  - type: BorgSwitchableSubtype # Goobstation
    borgSubtype: security_default
    
- type: borgSubtype
  parentBorgType: security
  id: security_default
  spritePath: Mobs/Silicon/chassis.rsi
  dummyPrototype: BorgChassisSecurity
  
  
- type: borgType
  id: security

  # Description
  dummyPrototype: BorgChassisSecurity

  # Functional
  extraModuleCount: 3
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleSecurity

  defaultModules:
  - BorgModuleNon-lethal
  - BorgModuleTool
  radioChannels:
  - Science
  - Security
  
  lawset: NTDefault
  
  addComponents:
  - type: ShowJobIcons
  - type: FlashImmunity
  - type: ShowSquadIcons # CorvaxGoob-SecApartment
  - type: ShowMindShieldIcons
  - type: ShowCriminalRecordIcons
  - type: ShowContrabandDetails

  # Visual
  inventoryTemplateId: borgShort
  spriteBodyState: sec
  spriteHasMindState: sec_e
  spriteNoMindState: sec_e_r
  spriteToggleLightState: sec_l

  # Pet
  petSuccessString: petting-success-generic-cyborg
  petFailureString: petting-failure-generic-cyborg
  
